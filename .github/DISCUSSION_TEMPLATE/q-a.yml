body:
  - type: markdown
    attributes:
      value: |
        This is for questions about using Vela. Something that is broken goes in a
        [bug report](https://github.com/PimpinPumpkin/Vela/issues/new?template=bug_report.yml), and something you
        want added goes in a [feature request](https://github.com/PimpinPumpkin/Vela/issues/new?template=feature_request.yml).
        Those are tracked and closed when they are done. A question here is not.

        The [FAQ](https://pimpinpumpkin.github.io/Vela/docs/) answers the common ones.
  - type: checkboxes
    id: kind
    attributes:
      label: Before you ask
      options:
        - label: This is a question, not a bug report or a feature request.
          required: true
        - label: I looked in the FAQ and searched the existing questions.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vela version
      description: Settings > About. Optional, but it often changes the answer.
    validations:
      required: false
