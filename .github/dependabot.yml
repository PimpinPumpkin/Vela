# Monthly, grouped, a few at a time: one pull request for the build's libraries and one for the
# GitHub Actions the workflows run (which are pinned to exact commits; this is what moves the pins).
# Security fixes come separately and at once, from Dependabot's alerts.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      libraries:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: [ "*" ]
