# Only the GitHub Actions the workflows run: one small grouped pull request a month, which is what
# moves their pinned commits. Library versions are NOT bumped on a schedule: an unread pile of
# pull requests helps nobody, and the large ones (the Compose toolkit) need a planned pass.
# Security fixes come separately, at once, from Dependabot's alerts and its security updates
# (repository settings, not this file).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: [ "*" ]
    ignore:
      # From v6 this action's caching is a closed-source component under Gradle's own terms of
      # use, accepted by upgrading. Vela stays on v5, the last fully open line. If v5 stops
      # working (GitHub retires its Node runtime), replace the action with actions/cache and a
      # wrapper checksum step; do not lift this without reading the terms.
      - dependency-name: "gradle/actions/setup-gradle"
        update-types: [ "version-update:semver-major" ]
