# Regenerates the committed baseline profile (app/src/release/generated/baselineProfiles/) on a
# headless emulator and commits it to canary when it changed. The profile itself is BAKED by every normal CI
# release build - this workflow only refreshes WHICH methods are recorded, so it runs on demand
# (and monthly) rather than per push: per-nightly regeneration would cost ~15 emulator-minutes a
# day for a file that only drifts when the app's hot paths change shape.
#
# NEVER point this (or local generation) at a connected phone: the test harness uninstalls the
# target app when it finishes, which on a real device wipes saved places and permission grants.
# The Gradle-managed emulator in :baselineprofile is the only sanctioned generator.
name: Regenerate baseline profile

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 2 * *" # monthly, 2nd at 07:15 UTC

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Fetch obf routing runtime jars
        # :core compiles against these (see ci.yml's identical step).
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" \
              "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f" \
            || curl -fSL -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done

      - name: Fetch Cronet runtime AAR
        # Chromium's own prebuilt Cronet for the version pinned in gradle.properties, packed as one
        # AAR (gitignored). From the `cronet-runtime` infra release, else the upstream repo's, else
        # packed right here from Chromium's bucket by the same script the release uses.
        run: |
          v=$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)
          f="app/libs/cronet-$v.aar"
          mkdir -p app/libs
          curl -fsSL -o "$f" "https://github.com/${{ github.repository }}/releases/download/cronet-runtime/cronet-$v.aar" \
          || curl -fsSL -o "$f" "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$v.aar" \
          || bash scripts/build-cronet-aar.sh "$v" app/libs
          test "$(stat -c%s "$f")" -gt 10000000

      - name: Fetch the TTS runtime AAR
        # Same fetch as ci.yml: the sherpa-onnx AAR is gitignored and hosted on the tts-runtime
        # release, and :app does not build without it (the Aug 2026 cron failed exactly here).
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/${{ github.repository }}/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar" \
          || curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"

      - name: Generate baseline profile
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :app:generateBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Keep the generated profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/

      - name: Check the profile reached the map
        # A journey stuck on a first-run page still writes a profile, of that page alone.
        run: |
          f=app/src/release/generated/baselineProfiles/baseline-prof.txt
          for c in app/vela/ui/map/MapScreenKt org/maplibre/android/maps/MapView; do
            grep -q "$c" "$f" || { echo "::error::The profile has no $c: the journey never reached the map."; exit 1; }
          done

      - name: Commit the profile to canary if it changed
        # main only: from another branch (a toolchain check on canary) the result is the artifact
        # above. The profile is generated from main's code and committed onto canary, the working
        # branch, which reaches main with the next canary push to main. The repository does not let
        # Actions open pull requests, and a branch left for one by hand went stale. A push with the
        # job's own token starts no workflow, so the canary build takes the profile with the next
        # push there.
        if: github.ref == 'refs/heads/main'
        run: |
          # git status, not git diff: the first profile is a new file, which a diff does not see.
          if [ -z "$(git status --porcelain app/src/release/generated/baselineProfiles/)" ]; then
            echo "Profile unchanged - nothing to do."
            exit 0
          fi
          keep="$(mktemp -d)"
          cp -r app/src/release/generated/baselineProfiles "$keep/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=20 origin +refs/heads/canary:refs/remotes/origin/canary
            git checkout -f -B profile-to-canary refs/remotes/origin/canary
            rm -rf app/src/release/generated/baselineProfiles
            mkdir -p app/src/release/generated
            cp -r "$keep/baselineProfiles" app/src/release/generated/
            git add -A app/src/release/generated/baselineProfiles/
            if git diff --cached --quiet; then echo "canary already has this profile."; exit 0; fi
            git commit -q -m "The startup profile is refreshed for the current code"
            # canary can move while the job runs: fetch it again and redo the commit on top.
            if git push origin HEAD:refs/heads/canary; then exit 0; fi
            sleep $((attempt * 10))
          done
          echo "::warning::Could not push the refreshed profile to canary; it is in the artifact."
