name: Issue triage

# First look at a newly opened issue, before the maintainer reads it: a comment listing earlier
# issues that share its wording, and on a bug report from a build older than the current stable,
# the `incomplete` label with a note to update. Plain text matching in scripts/issue-triage.py;
# no model and no outside service. It never closes an issue.
#
# The title and body are untrusted input. They reach the script only through the event file
# ($GITHUB_EVENT_PATH), never through a ${{ }} expression in a shell line.

on:
  issues:
    types: [ opened ]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/issue-triage.py
          sparse-checkout-cone-mode: false
      - name: Triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue-triage.py
