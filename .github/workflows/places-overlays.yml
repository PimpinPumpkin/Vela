name: Open places overlays

# Bakes the open places layer (Overture Maps Places -> PMTiles) per region from tools/places-regions.json
# and publishes the archives + places-overlay-manifest.json on the `places-overlays` release. ADDITIVE and
# reversible: its own release + manifest; delete the release to revert. Manual only while the layer is beta.

on:
  schedule:
    # Overture publishes monthly. The 6th bakes the first half of the catalog, the 7th the second
    # (the matrix caps at 256 jobs), both against the newest release in the bucket.
    - cron: "0 5 6 * *"
    - cron: "0 5 7 * *"
    # And a seventh of the catalog every night, so an OpenStreetMap edit reaches the map on its own
    # within a week (OSM is a real source here, not just a position donor). A seventh rather than
    # everything: a full nightly pass would re-publish every archive every night, and anyone who
    # DOWNLOADED a region would be offered a fresh few-hundred-MB copy of it daily. Streaming
    # readers, which is the default, pick up a rebaked archive with no prompt at all.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Region id to bake (blank = every region in tools/places-regions.json)
        required: false
        default: ""
      release:
        description: Overture release
        required: false
        default: "2026-08-19.0"
      shard:
        description: "Which half of the catalog to bake when `only` is blank: a = first half by id, b = second half, blank = all (fails past 256 regions, the matrix cap)"
        required: false
        default: ""
      rev:
        description: "Revision stamp to publish as (blank = today, UTC). Two bakes on the same day would otherwise share a revision, which skips the patch; set this to test the delta path."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      release: ${{ steps.rel.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          SHARD="${{ github.event.inputs.shard }}"
          NIGHTLY=""
          case "${{ github.event.schedule }}" in
            "0 5 6 * *") SHARD=a ;;
            "0 5 7 * *") SHARD=b ;;
            "40 4 * * *") NIGHTLY="$(( $(date -u +%u) - 1 ))" ;;
          esac
          if [ -n "${{ github.event.inputs.only }}" ]; then
            jq -c --arg id "${{ github.event.inputs.only }}" '{include: [.regions[] | select(.id == $id)]}' tools/places-regions.json > m.json
          elif [ -n "$NIGHTLY" ]; then
            # Tonight's seventh, by position in the sorted catalog: every region comes round once a
            # week, and the same region always falls on the same night.
            jq -c --argjson n "$NIGHTLY" '{include: [(.regions | sort_by(.id) | to_entries[] | select((.key % 7) == $n) | .value)]}' tools/places-regions.json > m.json
          else
            # Two shards by sorted id: GitHub caps a matrix at 256 jobs and the catalog is past that.
            case "$SHARD" in
              a) jq -c '(.regions | sort_by(.id)) as $r | {include: $r[0:(($r | length) / 2 | ceil)]}' tools/places-regions.json > m.json ;;
              b) jq -c '(.regions | sort_by(.id)) as $r | {include: $r[(($r | length) / 2 | ceil):]}' tools/places-regions.json > m.json ;;
              *) jq -c '{include: .regions}' tools/places-regions.json > m.json ;;
            esac
          fi
          # Each region's OSM extract comes along (matched by id against the routing catalog, which
          # carries the Geofabrik URLs): the bake prefers OpenStreetMap's own coordinate for a shop,
          # since that is the one anybody can correct.
          jq -c --slurpfile r tools/routing-regions.json '
            (($r[0].regions // $r[0]) | map({key: .id, value: .pbf_url}) | from_entries) as $pbf
            | {include: [ .include[] | . + {pbf_url: ($pbf[.id] // "")} ]}' m.json > m2.json
          echo "matrix=$(cat m2.json)" >> "$GITHUB_OUTPUT"
      - id: rel
        name: Pick the Overture release
        run: |
          # A dispatch may pin a release; a scheduled run takes the newest one in the public bucket.
          REL="${{ github.event.inputs.release }}"
          if [ -z "$REL" ]; then
            REL=$(curl -sL "https://overturemaps-us-west-2.s3.amazonaws.com/?prefix=release/&delimiter=/" | grep -oE 'release/[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+/' | sort | tail -1 | sed 's#release/##; s#/$##')
          fi
          echo "release=${REL:-2026-08-19.0}" >> "$GITHUB_OUTPUT"
          echo "overture release: ${REL:-2026-08-19.0}"
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view places-overlays --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create places-overlays --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Open places overlays" \
              --notes "Data release: the open places layer, Overture Maps Places baked to PMTiles per region. Not an app build. Overture Places is CDLA-Permissive 2.0."

  bake:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 8 per shard, 16 across the two. It was 4 because each job spent eight minutes scanning
      # Overture from S3; with the read pruned on bbox that scan is seconds and the job is mostly
      # tippecanoe, which is per-runner work. More than this just queues against the account's own
      # job limit, which costs nothing but buys nothing either.
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The binaries are CACHED, and tippecanoe is PINNED so the cache key means something. Every
      # job used to build tippecanoe from source: 69 s of what is now a ~2 minute job, 414 times a
      # wave, for a binary that does not change between them.
      - name: Cache the bake toolchain
        uses: actions/cache@v4
        with:
          path: ~/vela-bin
          key: bake-tools-${{ runner.os }}-tippecanoe-2.79.0-pmtiles-1.31.2-duckdb-latest
      - name: Install duckdb + tippecanoe + pmtiles
        run: |
          # osmium (the OSM position pass) and jq are apt's, and cheap; the rest is the cache.
          sudo apt-get update -qq && sudo apt-get install -y -qq jq osmium-tool
          if [ ! -x "$HOME/vela-bin/tippecanoe" ]; then
            echo "toolchain cache miss, building"
            mkdir -p "$HOME/vela-bin"
            curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
            unzip -q duckdb.zip && mv duckdb "$HOME/vela-bin/duckdb"
            # go-pmtiles: `pmtiles extract` pulls a region's AllThePlaces tiles by range request.
            curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar -xz pmtiles
            mv pmtiles "$HOME/vela-bin/pmtiles"
            sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
            git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
            make -C /tmp/tippecanoe -j"$(nproc)" >/dev/null
            cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tippecanoe-decode "$HOME/vela-bin/"
          fi
          sudo cp "$HOME/vela-bin/"* /usr/local/bin/
          tippecanoe --version 2>&1 | head -1; duckdb --version; pmtiles version | head -1
      # A continent-sized region needs far more scratch than the runner's root disk has: the
      # AllThePlaces extract alone is 619 MB for Australia, the OSM extract 1.3 GB, and DuckDB's
      # spill and tippecanoe's temp files land beside them. Root has about 14 GB free and /mnt has
      # about 65, and a runner whose disk fills is reported as "the runner has received a shutdown
      # signal" with no output at all, which reads like flaky infrastructure (five regions, twice,
      # 2026-09-18). mktemp, DuckDB and tippecanoe all honor TMPDIR.
      - name: Scratch space on the big disk
        run: |
          sudo mkdir -p /mnt/vela-work && sudo chown "$(id -u):$(id -g)" /mnt/vela-work
          df -h / /mnt | sed 's/^/  /'
          echo "  cpus $(nproc), memory $(free -g | awk 'NR==2 {print $2}') GB"
      # The archive currently published, kept for the patch. Fetched before the bake so the two
      # exist side by side; a region with nothing published yet simply gets no patch.
      - name: Fetch what is published, for the delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_REV=$(curl -sL "https://github.com/$GITHUB_REPOSITORY/releases/download/places-overlays/places-overlay-manifest.json" \
            | jq -r --arg id "${{ matrix.id }}" '.regions[] | select(.id == $id) | .rev // 0' | head -1)
          echo "PREV_REV=${PREV_REV:-0}" >> "$GITHUB_ENV"
          if [ -n "$PREV_REV" ] && [ "$PREV_REV" != "0" ] && [ "$PREV_REV" != "null" ]; then
            curl -sfL -o prev.pmtiles \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/places-overlays/places-${{ matrix.id }}.pmtiles" \
              && echo "have rev $PREV_REV ($(du -m prev.pmtiles | cut -f1) MB) to diff against" \
              || { rm -f prev.pmtiles; echo "could not fetch the published archive; no patch this run"; }
          fi
      - name: Bake ${{ matrix.id }}
        run: |
          B='${{ toJson(matrix.bbox) }}'
          S=$(echo "$B" | jq '.[0]'); W=$(echo "$B" | jq '.[1]'); N=$(echo "$B" | jq '.[2]'); E=$(echo "$B" | jq '.[3]')
          TMPDIR=/mnt/vela-work OSM_PBF="${{ matrix.pbf_url }}" bash tools/build-places-region.sh "${{ matrix.id }}" "$S" "$W" "$N" "$E" "places-${{ matrix.id }}.pmtiles" "${{ needs.plan.outputs.release }}"
      - name: Upload archive + emit manifest entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "places-${{ matrix.id }}.pmtiles" ]; then echo "no archive for ${{ matrix.id }} (no places); skipping"; mkdir -p entries; exit 0; fi
          # GitHub's asset upload answers 500 on the big archives often enough to fail a run on its
          # own (Southern California, 300 MB, twice on 2026-09-17). Retry with a backoff; the bake
          # itself is the expensive part and it has already run by here.
          for try in 1 2 3 4; do
            if gh release upload places-overlays "places-${{ matrix.id }}.pmtiles" --clobber --repo "$GITHUB_REPOSITORY"; then break; fi
            if [ "$try" = 4 ]; then echo "upload failed after $try tries"; exit 1; fi
            echo "upload attempt $try failed; retrying in $((try * 30))s"
            sleep $((try * 30))
          done
          mkdir -p entries
          SIZE=$(stat -c %s "places-${{ matrix.id }}.pmtiles")
          REV=$(date -u +%Y%m%d)
          [ -n "${{ github.event.inputs.rev }}" ] && REV="${{ github.event.inputs.rev }}"
          DELTA=null
          # A PATCH AGAINST WHAT IS PUBLISHED. A week of edits moves about 1% of a region's tiles,
          # so a phone that already has the old archive can take a few MB instead of a few hundred
          # (see ROADMAP). The patch is BUILT AND PROVEN here or it is not published: it is applied
          # to a copy of the old archive and the result has to carry the new one's fingerprint, so a
          # patch that would leave somebody with a subtly wrong map never reaches them.
          if [ -f "prev.pmtiles" ] && [ -n "$PREV_REV" ] && [ "$PREV_REV" != "0" ] && [ "$PREV_REV" != "$REV" ]; then
            if python3 scripts/pmtiles-make-patch.py prev.pmtiles "places-${{ matrix.id }}.pmtiles" \
                 "patch.vpatch" --rev-from "$PREV_REV" --rev-to "$REV"; then
              PSIZE=$(stat -c %s patch.vpatch)
              # Past about a third of the archive the saving stops being worth a second code path.
              if [ "$PSIZE" -lt "$((SIZE / 3))" ] && cp prev.pmtiles check.pmtiles && \
                 python3 scripts/pmtiles-apply-patch.py check.pmtiles patch.vpatch --verify; then
                PNAME="places-${{ matrix.id }}.$PREV_REV.vpatch"
                mv patch.vpatch "$PNAME"
                if gh release upload places-overlays "$PNAME" --clobber --repo "$GITHUB_REPOSITORY"; then
                  DELTA=$(jq -n --argjson fromRev "$PREV_REV" \
                    --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/places-overlays/$PNAME" \
                    --argjson sizeMb "$(echo "scale=2; $PSIZE/1000000" | bc)" \
                    '{fromRev:$fromRev,url:$url,sizeMb:$sizeMb}')
                  echo "patch $PNAME: $(echo "scale=1; $PSIZE/1000000" | bc) MB of $(echo "scale=1; $SIZE/1000000" | bc) MB"
                fi
              else
                echo "patch not published: $(echo "scale=1; $PSIZE/1000000" | bc) MB against a $(echo "scale=1; $SIZE/1000000" | bc) MB archive is too big, or it did not verify"
              fi
            fi
            rm -f check.pmtiles prev.pmtiles patch.vpatch
          fi
          jq -n --arg id "${{ matrix.id }}" --arg name "${{ matrix.name }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/places-overlays/places-${{ matrix.id }}.pmtiles" \
            --argjson sizeMb "$(echo "scale=2; $SIZE/1000000" | bc)" --argjson bbox '${{ toJson(matrix.bbox) }}' --argjson rev "$REV" \
            --argjson delta "$DELTA" \
            '{id:$id,name:$name,url:$url,sizeMb:$sizeMb,bbox:$bbox,rev:$rev} + (if $delta == null then {} else {delta:$delta} end)' > "entries/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: places-entry-${{ matrix.id }}
          path: entries/

  manifest:
    needs: bake
    if: always()
    runs-on: ubuntu-latest
    # No concurrency group: a pending job in one is CANCELLED when a newer run joins, which
    # emailed a failure for 34 of the 54 runs of a state-wide wave (2026-09-22) and, while the
    # merge still folded entries, dropped their revisions. The merge derives the manifest from
    # the release and re-lists it after uploading, so parallel merges are safe.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: places-entry-*
          path: entries
          merge-multiple: true
      - name: Merge entries into places-overlay-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p entries
          bash scripts/merge-places-manifest.sh entries
