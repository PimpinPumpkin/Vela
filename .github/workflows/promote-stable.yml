name: Promote weekly stable

# A daily cron in ci.yml cuts a PRERELEASE nightly when main has moved. Once a week this
# workflow promotes the newest nightly to the stable channel by flipping its
# prerelease flag and marking it Latest. Same tag, same signed APK, no rebuild:
# the stable release is a bits-identical nightly that has been out in the wild.
# Default Obtainium installs (and the in-app updater, which reads releases/latest)
# therefore move at a weekly cadence; nightly users opt in to prereleases.
#
# The promoted release's notes are regenerated to span everything since the
# PREVIOUS stable, so weekly users see the whole week's changelog, not just the
# last push's slice.
#
# Two optional inputs, for a promotion asked for by hand or by release.yml:
#   tag        the nightly expected to be the newest; the run stops if another one is
#   whats_new  a hand-written list that leads the notes, above the generated changelog. The
#              in-app What's new dialog shows the notes as they are, so the list is what people
#              read first.

on:
  schedule:
    - cron: "0 16 * * 1" # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "The nightly expected to be promoted, such as v0.4.2400 (optional). The run stops if the newest is another."
        type: string
        default: ''
      whats_new:
        description: "The What's new list that leads the notes, one '- ' line per item (optional)."
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      whats_new:
        type: string
        default: ''

permissions:
  contents: write

concurrency: promote-stable

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full tag history for the changelog span

      - name: Promote newest nightly to stable
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_TAG: ${{ inputs.tag }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          set -euo pipefail
          # Newest prerelease and newest stable, by run number (the tag scheme is
          # v0.<minor>.<run> and run is globally monotonic, so numeric-sorting the
          # final component orders releases across minor bumps too).
          runof() { echo "${1##*.}"; }
          # App releases ONLY: the repo also hosts infra file releases (obf-runtime, tts-runtime,
          # routing-graphs, ...) whose tags are not versions. An unbounded "newest prerelease"
          # picked obf-tools the week it was created and promoted IT to stable, which knocked the
          # real stable off releases/latest and starved the updater and the F-Droid build of an
          # APK. Every release query here must bound to the v0.* tag scheme.
          # PAGINATED (2026-09-28): the repo can hold hundreds of data releases (one per region for
          # the grid cells), so a `--limit N` window can hold no app release at all.
          NIGHTLY="$(gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
            --jq '.[] | select(.prerelease) | select(.tag_name | test("^v0\\.[0-9]+\\.[0-9]+$")) | .tag_name' | sed -n 1p)"
          STABLE="$(gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
            --jq '.[] | select(.prerelease | not) | select(.tag_name | test("^v0\\.[0-9]+\\.[0-9]+$")) | .tag_name' | sed -n 1p)"
          if [ -n "$WANT_TAG" ] && [ "$NIGHTLY" != "$WANT_TAG" ]; then
            if [ "$STABLE" = "$WANT_TAG" ]; then echo "$WANT_TAG is already the stable."; exit 0; fi
            echo "::error::The newest nightly is ${NIGHTLY:-none}, not the $WANT_TAG this promotion was asked for."
            exit 1
          fi
          if [ -z "$NIGHTLY" ]; then
            echo "No nightly to promote."
            exit 0
          fi
          if [ -n "$STABLE" ] && [ "$(runof "$NIGHTLY")" -le "$(runof "$STABLE")" ]; then
            echo "Newest nightly $NIGHTLY is not newer than stable $STABLE. Nothing to do."
            exit 0
          fi
          VER="${NIGHTLY#v}"
          # Regenerate the notes to cover the whole span since the previous stable.
          if [ -n "$STABLE" ]; then
            LOG="$(bash scripts/changelog.sh "${STABLE}..${NIGHTLY}")"
            COMPARE="**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${STABLE}...${NIGHTLY}"
          else
            LOG="$(bash scripts/changelog.sh -n 30 "$NIGHTLY")"
            COMPARE=""
          fi
          [ -z "$LOG" ] && LOG="- Maintenance and internal changes"
          if [ -n "$WHATS_NEW" ]; then
            SINCE="Everything since ${STABLE#v}"
            [ -n "$STABLE" ] || SINCE="Everything in this release"
            NOTES="$(printf 'What'\''s new in %s\n\n%s\n\n%s\n\n%s\n\n%s\n' "$VER" "$WHATS_NEW" "$SINCE" "$LOG" "$COMPARE")"
          else
            NOTES="$(printf 'What'\''s changed in %s\n\n%s\n\n%s\n' "$VER" "$LOG" "$COMPARE")"
          fi
          # Drop the "nightly" from the title: the same release is the stable now.
          gh release edit "$NIGHTLY" \
            --title "Vela $VER" \
            --prerelease=false \
            --latest \
            --notes "$NOTES"
          echo "Promoted $NIGHTLY to stable."
