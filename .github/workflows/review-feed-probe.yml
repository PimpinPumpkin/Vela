name: Review feed probe

# On-demand probe of Google's review feed (qv9Egd) from a clean GitHub machine: fresh IP, fresh
# session, nothing on the maintainer's phones or connection. Runs on a push to the feed-probe
# branch or by hand. Prints one FEEDPROBE line per reply and uploads the raw replies, so a reply
# the parser cannot read can be studied. See core/src/test/.../ReviewFeedProbeTest.kt.

on:
  push:
    branches: [feed-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Fetch obf routing runtime jars
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f"
          done

      - name: Probe the review feed
        run: ./gradlew :core:testDebugUnitTest --tests '*ReviewFeedProbeTest' -DvelaFeedProbe=true --rerun-tasks --no-daemon

      - name: Report
        if: always()
        run: |
          f=$(ls core/build/test-results/testDebugUnitTest/*ReviewFeedProbeTest*.xml 2>/dev/null | head -1)
          { echo "### Review feed probe"; echo; echo '```'; grep -ho 'FEEDPROBE|[^<]*' "$f" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -ho 'FEEDPROBE|[^<]*' "$f" 2>/dev/null || true

      - name: Upload raw replies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feed-probe-replies
          path: core/build/feed-probe/
          if-no-files-found: warn
