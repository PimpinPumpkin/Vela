name: OpenSSF Scorecard

# An outside score of how the repository itself is run (pinned actions, token permissions,
# branch protection, security policy, automated checks). Published at
# https://scorecard.dev/viewer/?uri=github.com/PimpinPumpkin/Vela and on the code scanning page.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '40 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
