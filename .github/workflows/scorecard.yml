name: OpenSSF Scorecard

# An outside score of how the repository itself is run (pinned actions, token permissions,
# branch protection, security policy, automated checks). Published at
# https://scorecard.dev/viewer/?uri=github.com/PimpinPumpkin/Vela and on the code scanning page.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '40 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
