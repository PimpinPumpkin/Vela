name: Security checks

# Three checks that run on GitHub's machines, not on anyone's laptop:
#   scan          a static scan of the app's source for known insecure Android patterns
#                 (mobsfscan), reported to the repository's code scanning page.
#   sbom          exports the bill of materials (SBOM) from GitHub's dependency graph, which
#                 the repository's automatic dependency submission fills from the real build
#                 and which Dependabot's vulnerability alerts are computed from.
#   review        on a pull request, fails when it adds a library with a known high-severity
#                 vulnerability.
# None of these gate a release: a finding is a report to read, not a red build of the app.

on:
  push:
    branches: [ main, canary ]
    # A push that only touches the docs has no source to scan: the same list ci.yml skips.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fdroid/metadata/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'site/**'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '20 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Static scan
        # Exit code 1 means "found something", which is a report, not a failure.
        run: |
          pip install --quiet mobsfscan==1.0.1
          mobsfscan --config .mobsf --sarif -o mobsfscan.sarif app/src/main core/src/main || true
          mobsfscan --config .mobsf app/src/main core/src/main || true
      - name: Report to code scanning
        # A pull request from a fork has no permission to write results; the log above has them.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  sbom:
    # GitHub's own "Automatic dependency submission" run (a repository setting) resolves the
    # Gradle build and fills the dependency graph; this exports that graph as an SPDX file.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Export the bill of materials
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub builds the file on request and sometimes answers "Request timed out" (HTTP 500).
        # Three tries, then a warning: a missing export is not a failed security check.
        run: |
          for try in 1 2 3; do
            if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --jq .sbom > vela-sbom.spdx.json; then
              exit 0
            fi
            rm -f vela-sbom.spdx.json
            sleep $((try * 60))
          done
          echo "::warning::GitHub did not produce the bill of materials this run."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vela-sbom
          path: vela-sbom.spdx.json
          retention-days: 90
          if-no-files-found: ignore

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
