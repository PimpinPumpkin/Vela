org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true

ksp.incremental=true

# Cronet (Chromium's network stack) build the app ships: Chrome for Android stable, pinned here so a
# commit always builds against the same binary. Bump it with the claimed Chrome major; the
# cronet-runtime workflow publishes the AAR for a version, scripts/build-cronet-aar.sh makes one
# locally.
vela.cronetVersion=155.0.8059.16
